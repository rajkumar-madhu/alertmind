events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;
  gzip_types    text/plain text/css application/json application/javascript text/xml application/xml;

  # Rate limiting
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=rag:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

  upstream api      { server api:8000; }
  upstream web      { server web:80; }
  # upstream flowise  { server flowise:3001; }   # disabled for core-only local run
  # upstream n8n      { server n8n:5678; }        # disabled for core-only local run
  upstream keycloak { server keycloak:8080; }

  server {
    listen 80;
    server_name _;
    client_max_body_size 50M;

    # API
    location /api/webhook/ {
      default_type application/json;
      return 403 '{"detail":"Webhook is cluster-internal"}';
    }

    location /api/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass         http://api;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 120s;
    }

    # Keycloak Auth — tighter than /api/: this is the ROPC password endpoint
    location /auth/ {
      limit_req zone=auth burst=5 nodelay;
      proxy_pass         http://keycloak;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_buffer_size          128k;
      proxy_buffers              4 256k;
      proxy_busy_buffers_size    256k;
    }

    # Health check
    location /health {
      proxy_pass http://api;
    }

    # Flowise (disabled for core-only local run)
    # location /flowise/ {
    #   proxy_pass         http://flowise/;
    #   proxy_set_header   Host $host;
    #   proxy_http_version 1.1;
    #   proxy_set_header   Upgrade $http_upgrade;
    #   proxy_set_header   Connection "upgrade";
    # }

    # n8n webhooks (disabled for core-only local run)
    # location /webhook/ {
    #   proxy_pass         http://n8n/;
    #   proxy_set_header   Host $host;
    #   proxy_http_version 1.1;
    #   proxy_set_header   Upgrade $http_upgrade;
    #   proxy_set_header   Connection "upgrade";
    # }

    # Frontend (catch-all → React SPA)
    location / {
      proxy_pass         http://web;
      proxy_set_header   Host $host;
      proxy_intercept_errors on;
      error_page 404 = /index.html;
    }
  }
}

