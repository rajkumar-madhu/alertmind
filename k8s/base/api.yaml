apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: alertmind
spec:
  # Single-node kind cluster (16 GB) — the cluster runs one replica of each
  # app tier. Keep this at 1 so `kubectl apply -k` doesn't silently scale up.
  # The api is still stateless (uploads/logs are per-pod emptyDir), so this is
  # a capacity choice, not a correctness one.
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: registry.gitlab.com/rajkumarmadhu2024/artinfra-finsot/api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: alertmind-config
            - secretRef:
                name: alertmind-secrets
          env:
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: alertmind-groq
                  key: api-key
            # OpenAI-compatible provider (xAI/Grok). Takes precedence over GROQ_* in
            # api/llm.py. Secret is created imperatively, never committed:
            #   kubectl -n alertmind create secret generic alertmind-llm \
            #     --from-literal=api-key='<key>'
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: alertmind-llm
                  key: api-key
                  optional: true
            - name: LLM_API_BASE
              value: "https://api.x.ai/v1"
            - name: LLM_API_MODEL
              value: "grok-4.5"
          volumeMounts:
            - name: uploads
              mountPath: /tmp/alertmind-uploads
            - name: logs
              mountPath: /app/logs
          livenessProbe:
            httpGet:
              path: /api/health/
              port: 8000
              httpHeaders:
                - name: Host
                  value: api
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/
              port: 8000
              httpHeaders:
                - name: Host
                  value: api
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
            limits:
              memory: "1Gi"
      volumes:
        - name: uploads
          emptyDir: {}
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: alertmind
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
