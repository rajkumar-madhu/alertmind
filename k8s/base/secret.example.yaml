# TEMPLATE ONLY — documents the shape of secret/alertmind-secrets. Never applied.
#
# This file is intentionally NOT in kustomization.yaml. Its predecessor
# (k8s/base/secret.yaml) carried live credentials and WAS applied, which meant every
# `apply -k` rewrote the cluster Secret from a committed file — a direct violation of
# the "never commit live secrets" rule in /root/CLAUDE.md.
#
# Create the real Secret with ../create-secrets.sh BEFORE the first `kubectl apply -k`,
# otherwise the api/celery pods start without a database URL.
#
#   cd k8s && ./create-secrets.sh --status     # what exists now
#   cd k8s && ./create-secrets.sh              # create with generated passwords
#
# The SUPABASE_* keys are dead — a leftover of the pre-Django Express stack. The
# Django backend reads none of them; they are kept only so the key set matches what is
# already live in the cluster.
apiVersion: v1
kind: Secret
metadata:
  name: alertmind-secrets
  namespace: alertmind
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME"
  DATABASE_URL: "postgresql://alertmind:CHANGE_ME@postgresql:5432/alertmind"
  JWT_SECRET: "CHANGE_ME"
  SUPABASE_URL: ""
  SUPABASE_SERVICE_KEY: ""
  SUPABASE_ANON_KEY: ""
  SLACK_WEBHOOK_URL: ""
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_USER: ""
  SMTP_PASS: ""
  FLOWISE_PASS: "CHANGE_ME"
  N8N_PASS: "CHANGE_ME"
---
# The LLM provider key lives in its own Secret so api.yaml/celery.yaml can mount it
# with `optional: true` — the manifests still apply on a cluster without a key.
apiVersion: v1
kind: Secret
metadata:
  name: alertmind-llm
  namespace: alertmind
type: Opaque
stringData:
  api-key: "CHANGE_ME"
