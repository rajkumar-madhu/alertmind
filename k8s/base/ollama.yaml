apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: alertmind
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      # CPU-only on veltacore-prod-in (16 GB RAM, no GPU).
      # NOTE: llama3.3:70b requires ~43 GB RAM; use llama3.2:3b or phi3.5 on this node.
      # To add GPU later: label the node with accelerator=nvidia-gpu, install the
      # nvidia-device-plugin, and restore nodeSelector + GPU resource limits.
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
          readinessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              memory: "2Gi"
            limits:
              memory: "12Gi"
      volumes:
        - name: ollama-data
          persistentVolumeClaim:
            claimName: ollama-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-pvc
  namespace: alertmind
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      # llama3.3:70b-instruct-q4_K_M ~43GB + nomic-embed-text ~300MB
      storage: 80Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: alertmind
spec:
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434
---
# One-time Job to pull models after Ollama is running.
# Run: kubectl apply -f ollama-model-pull.yaml -n alertmind
# or use: kubectl exec -n alertmind <ollama-pod> -- ollama pull llama3.3:70b-instruct-q4_K_M
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-model-pull
  namespace: alertmind
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-ollama
          image: busybox:1.36
          command: ["sh", "-c", "until wget -qO- http://ollama:11434 > /dev/null 2>&1; do echo waiting for ollama; sleep 5; done"]
      containers:
        - name: pull-models
          image: ollama/ollama:latest
          env:
            - name: OLLAMA_HOST
              value: "http://ollama:11434"
          command:
            - sh
            - -c
            - |
              ollama pull llama3.2:3b
              ollama pull nomic-embed-text
          resources:
            requests:
              memory: "512Mi"
