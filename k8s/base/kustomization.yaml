apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: alertmind
resources:
  - namespace.yaml
  - configmap.yaml
  # secret.yaml is deliberately absent: alertmind-secrets + alertmind-llm are created
  # imperatively by ../create-secrets.sh. See base/secret.example.yaml for the shape.
  - db-init-configmap.yaml
  - nginx-configmap.yaml
  - postgresql.yaml
  - redis.yaml
  - opa.yaml
  - api.yaml
  - celery.yaml
  - web.yaml
  - flowise.yaml
  - n8n.yaml
  - ollama.yaml
  - ollama-embed.yaml
  - nginx.yaml
  - ingress.yaml
  - api-ingress.yaml
