# Self-hosted Ollama for the RAG pipeline: embeddings AND generation.
#
# Ollama has no API key — it is an unauthenticated in-cluster server. Provider choice
# is made purely by whether GROQ_API_KEY is non-empty (see api/llm.py): set it and
# generation goes to Groq; leave it empty and generation comes here. Embeddings ALWAYS
# come here regardless, because Groq serves no embedding model.
#
# WHY THIS EXISTS, separate from ollama.yaml:
#   With no Ollama reachable, `generate_embedding()` returns None, `query_vector_store()`
#   returns [], and every AI analysis silently degrades to a no-context prompt with
#   confidence pinned at 15. That was the live state of this cluster: all three `ollama`
#   Services (linkedeye, devarchitect, odysseus) had zero endpoints and no Ollama pod
#   existed anywhere.
#
#   ollama.yaml is sized for llama3.3:70b (80Gi PVC, 12Gi RAM) and is $patch:delete'd by
#   overlays/prod — that model needs ~43 GB and cannot run here. This one holds
#   nomic-embed-text (~274 MB) + the small chat model in LLM_MODEL. Keeps the name
#   `ollama-embed` so the overlay's delete patches (which target `ollama`) leave it alone.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-embed
  namespace: alertmind
spec:
  replicas: 1
  strategy:
    type: Recreate          # ReadWriteOnce PVC — single writer
  selector:
    matchLabels:
      app: ollama-embed
  template:
    metadata:
      labels:
        app: ollama-embed
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          env:
            # Embeddings are short, bursty calls; keep the model resident.
            - name: OLLAMA_KEEP_ALIVE
              value: "24h"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "2"          # nomic-embed-text + the chat model
          volumeMounts:
            - name: data
              mountPath: /root/.ollama
          readinessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "4"           # CPU-only inference — generation is CPU-bound
              memory: "6Gi"      # nomic-embed-text (~274MB) + llama3.2:3b (~2GB) resident
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ollama-embed-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-embed-pvc
  namespace: alertmind
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      # nomic-embed-text ~274 MB + llama3.2:3b ~2 GB. Do NOT raise this in place:
      # the local-path StorageClass has no volume expansion, so a changed size makes
      # `apply` fail on an immutable field. Recreate the PVC if you need more.
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-embed
  namespace: alertmind
spec:
  selector:
    app: ollama-embed
  ports:
    - port: 11434
      targetPort: 11434
---
# Pulls the embedding model once the server is up. Idempotent: `ollama pull` is a
# no-op when the model is already present, so re-applying is safe.
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-embed-model-pull-v2
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-ollama
          image: busybox:1.36
          command: ["sh", "-c", "until wget -qO- http://ollama-embed:11434 >/dev/null 2>&1; do echo waiting for ollama-embed; sleep 5; done"]
      containers:
        - name: pull
          image: ollama/ollama:latest
          env:
            - name: OLLAMA_HOST
              value: "http://ollama-embed:11434"
          command: ["sh", "-c", "ollama pull nomic-embed-text && ollama pull llama3.2:3b && ollama list"]
          resources:
            requests:
              memory: "256Mi"
