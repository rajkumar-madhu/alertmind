apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alertmind-ingress
  namespace: alertmind
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: nginx
  # Host-scoped only. A hostless catch-all rule was removed here: on this shared
  # cluster it makes ingress-nginx route ANY unmatched host to alertmind, which
  # hijacks traffic meant for other namespaces. Always bind rules to a host.
  rules:
    - host: alertmind.wecrew.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80
  tls:
    - hosts:
        - alertmind.wecrew.in
      secretName: alertmind-tls
