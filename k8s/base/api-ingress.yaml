apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alertmind-api-ingress
  namespace: alertmind
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: nginx
  rules:
    - host: alertmind.api.wecrew.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
  tls:
    - hosts:
        - alertmind.api.wecrew.in
      secretName: alertmind-api-tls
